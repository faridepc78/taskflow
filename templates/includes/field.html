<div class="field{% if field.errors %} has-error{% endif %}">
    <label class="field-label" for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if not field.field.required %}<span class="field-optional">Optional</span>{% endif %}</label>
    <div class="input-wrap">{{ field }}{% if field.field.widget.input_type == "password" %}<button class="password-toggle" type="button" data-password-toggle="{{ field.id_for_label }}" aria-label="Show {{ label|default:field.label|lower }}" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg></button>{% endif %}</div>
    {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {% if help %}<p class="field-help">{{ help }}</p>{% endif %}
    {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
