{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#176b53">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <script src="{% static 'js/theme-init.js' %}?v=redesign1"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=redesign1">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "includes/icons.html" %}
    {% include "includes/messages.html" %}
    {% block content %}{% endblock %}
    <link rel="stylesheet" href="{% static 'css/date-picker.css' %}?v=1">
    <script src="{% static 'js/app.js' %}?v=datepicker1" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
